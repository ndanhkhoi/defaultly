name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint resources
        run: make lint

      - name: Test
        run: make test

      - name: Build and package
        run: VERSION="${GITHUB_REF_NAME#v}" make package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg dist/*.zip dist/SHA256SUMS.txt \
            --title "Defaultly ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag
